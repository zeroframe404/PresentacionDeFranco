name: Publicar en GitHub Pages

on:
  push:
    # Esta es hoy la rama por defecto del repositorio.
    # Si más adelante la renombrás a "main", el workflow sigue andando.
    branches:
      - main
      - claude/web-presentation-animations-7tk2pe
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - name: Subir el sitio (raíz del repositorio)
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
