name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # El PDF descargable se genera desde el propio sitio en cada
      # publicación, así nunca queda desfasado del contenido.
      - name: Generar el PDF descargable
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.49.1
          npx playwright install --with-deps chromium
          node tools/build-pdf.mjs

      - name: Comprobar que el PDF se generó
        run: test -s carta-presentacion-franco-martinez.pdf

      # Las dependencias de generación no forman parte del sitio.
      - name: Quitar las dependencias del artefacto
        run: rm -rf node_modules package-lock.json

      - uses: actions/configure-pages@v5

      - name: Subir el sitio (raíz del repositorio)
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
